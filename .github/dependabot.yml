version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: gradle
    directories:
      - /
      - /example
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      kotlin:
        group-by: dependency-name
        patterns: ["org.jetbrains.kotlin*"]
        exclude-patterns: ["org.jetbrains.kotlinx*"]
